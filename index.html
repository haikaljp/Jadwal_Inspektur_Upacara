
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Inspektur Upacara</title>

    <!-- Library untuk membuat PDF langsung -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #000080;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="date"],
        button {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        h2 {
            text-align: center;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        td,
        th {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: white;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        .col-no {
            width: 50px;
            text-align: center;
        }

        .col-nama {
            width: 50%;
        }

        .col-tanggal {
            width: 40%;
        }

        select {
            width: 100%;
            padding: 5px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-family: inherit;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            background: #eef;
        }

        /* Area khusus untuk hasil PDF */
        #pdfContent {
            background: white;
            color: black;
            width: 100%;
        }

        /* Tampilan tabel dalam PDF */
        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin: 0;
        }

        .pdf-table th,
        .pdf-table td {
            border: 1px solid black;
            padding: 10px;
            color: black;
            background: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .pdf-table th {
            text-align: center;
            font-weight: bold;
        }

        .pdf-table .col-no {
            width: 50px;
            text-align: center;
        }

        .pdf-table .col-nama {
            width: 50%;
        }

        .pdf-table .col-tanggal {
            width: 40%;
        }

        .pdf-table tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="controls no-print">
            <label for="startDate">
                Tanggal Mulai (Senin):
            </label>

            <input
                type="date"
                id="startDate"
                onchange="generateSchedule()"
            >

            <button
                type="button"
                id="downloadButton"
                onclick="cetakPDF()"
            >
                Cetak ke PDF (A4)
            </button>
        </div>

        <h2 class="no-print">
            Draft Jadwal Inspektur Upacara
        </h2>

        <table id="scheduleTable">
            <thead>
                <tr>
                    <th class="col-no">NO</th>
                    <th class="col-nama">INSPEKTUR UPACARA</th>
                    <th class="col-tanggal">TANGGAL</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <!-- Jadwal dibuat otomatis oleh JavaScript -->
            </tbody>
        </table>

    </div>

    <script>
        // Daftar nama yang tersedia
        const daftarNama = [
            "Usmuni",
            "Muhammad Oggy Yulian P.",
            "Suwaji",
            "Ulil Abshor",
            "Yahya Sachrul Wahyu Iman A",
            "Sekretaris"
        ];

        // Format tanggal Indonesia
        function formatIndoDate(date) {
            const months = [
                "Januari",
                "Februari",
                "Maret",
                "April",
                "Mei",
                "Juni",
                "Juli",
                "Agustus",
                "September",
                "Oktober",
                "November",
                "Desember"
            ];

            return `${String(date.getDate()).padStart(2, "0")} ${
                months[date.getMonth()]
            } ${date.getFullYear()}`;
        }

        // Mengubah tanggal menjadi format YYYY-MM-DD
        function formatInputDate(date) {
            const year = date.getFullYear();
            const month = String(
                date.getMonth() + 1
            ).padStart(2, "0");
            const day = String(
                date.getDate()
            ).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        // Membuat jadwal mingguan
        function generateSchedule() {
            const startInput =
                document.getElementById("startDate").value;

            if (!startInput) return;

            // Hindari pergeseran tanggal karena zona waktu
            const [year, month, day] = startInput
                .split("-")
                .map(Number);

            let currentDate = new Date(
                year,
                month - 1,
                day
            );

            // Jika bukan Senin, maju ke Senin berikutnya
            const dayOfWeek = currentDate.getDay();

            if (dayOfWeek !== 1) {
                const difference = dayOfWeek === 0
                    ? 1
                    : 8 - dayOfWeek;

                currentDate.setDate(
                    currentDate.getDate() + difference
                );
            }

            // Perbarui input ke tanggal Senin
            document.getElementById("startDate").value =
                formatInputDate(currentDate);

            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            // Buat enam baris jadwal
            for (let i = 0; i < daftarNama.length; i++) {
                const rowDate = new Date(currentDate);

                rowDate.setDate(
                    currentDate.getDate() + (i * 7)
                );

                const tr = document.createElement("tr");

                // Kolom nomor
                const tdNo = document.createElement("td");
                tdNo.className = "col-no";
                tdNo.textContent = i + 1;

                // Kolom nama
                const tdNama = document.createElement("td");
                tdNama.className = "col-nama";

                const select = document.createElement("select");
                select.className = "name-select";
                select.dataset.index = i;
                select.setAttribute(
                    "aria-label",
                    `Pilih inspektur upacara baris ${i + 1}`
                );

                // Pilihan awal kosong
                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = "-- Pilih Nama --";
                placeholder.selected = true;

                select.appendChild(placeholder);

                // Tambahkan nama ke dropdown
                daftarNama.forEach(function(nama) {
                    const option = document.createElement("option");
                    option.value = nama;
                    option.textContent = nama;
                    select.appendChild(option);
                });

                select.addEventListener(
                    "change",
                    updateDropdowns
                );

                tdNama.appendChild(select);

                // Kolom tanggal
                const tdTanggal = document.createElement("td");
                tdTanggal.className = "col-tanggal";
                tdTanggal.textContent = formatIndoDate(rowDate);

                tr.appendChild(tdNo);
                tr.appendChild(tdNama);
                tr.appendChild(tdTanggal);

                tbody.appendChild(tr);
            }

            updateDropdowns();
        }

        // Mencegah nama yang sama dipilih pada baris berbeda
        function updateDropdowns() {
            const selects = document.querySelectorAll(".name-select");

            const selectedValues = Array.from(selects)
                .map(select => select.value)
                .filter(value => value !== "");

            selects.forEach(function(select) {
                const currentValue = select.value;

                Array.from(select.options).forEach(function(option) {
                    if (option.value === "") return;

                    const alreadySelected =
                        selectedValues.includes(option.value) &&
                        option.value !== currentValue;

                    option.disabled = alreadySelected;
                    option.hidden = alreadySelected;
                });
            });
        }

        // Membuat dan mengunduh PDF secara langsung
        async function cetakPDF() {
            const button = document.getElementById("downloadButton");

            // Pastikan library sudah berhasil dimuat
            if (typeof html2pdf === "undefined") {
                alert(
                    "Library PDF belum tersedia. " +
                    "Periksa koneksi internet lalu muat ulang halaman."
                );
                return;
            }

            // Cegah klik berulang selama proses PDF
            button.disabled = true;
            button.textContent = "Membuat PDF...";

            try {
                const originalTable =
                    document.getElementById("scheduleTable");

                // Salin tabel agar dropdown asli tidak berubah
                const pdfTable = originalTable.cloneNode(false);
                pdfTable.className = "pdf-table";

                // Salin kepala tabel
                const originalHead = originalTable.querySelector("thead");
                if (originalHead) {
                    pdfTable.appendChild(originalHead.cloneNode(true));
                }

                // Buat isi tabel khusus PDF
                const pdfBody = document.createElement("tbody");
                const rows = originalTable.querySelectorAll("tbody tr");

                rows.forEach(function(row) {
                    const pdfRow = document.createElement("tr");
                    const cells = row.querySelectorAll("td");

                    cells.forEach(function(cell, index) {
                        const pdfCell = document.createElement("td");

                        if (index === 0) {
                            pdfCell.className = "col-no";
                        } else if (index === 1) {
                            pdfCell.className = "col-nama";

                            const select = cell.querySelector("select");

                            // Tampilkan nama yang dipilih sebagai teks
                            pdfCell.textContent = select && select.value
                                ? select.value
                                : "—";
                        } else {
                            pdfCell.className = "col-tanggal";
                            pdfCell.textContent = cell.textContent;
                        }

                        pdfRow.appendChild(pdfCell);
                    });

                    pdfBody.appendChild(pdfRow);
                });

                pdfTable.appendChild(pdfBody);

                // Buat area khusus untuk PDF
                const pdfContent = document.createElement("div");
                pdfContent.id = "pdfContent";
                pdfContent.style.width = "100%";
                pdfContent.appendChild(pdfTable);

                const options = {
                    margin: [15, 15, 15, 15],
                    filename: "Jadwal_Inspektur_Upacara.pdf",

                    image: {
                        type: "jpeg",
                        quality: 1
                    },

                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: "#ffffff",
                        logging: false
                    },

                    jsPDF: {
                        unit: "mm",
                        format: "a4",
                        orientation: "portrait"
                    },

                    pagebreak: {
                        mode: ["css", "legacy"],
                        avoid: ["tr"]
                    }
                };

                await html2pdf()
                    .set(options)
                    .from(pdfContent)
                    .save();

            } catch (error) {
                console.error("Gagal membuat PDF:", error);

                alert(
                    "PDF gagal dibuat. Silakan coba kembali."
                );
            } finally {
                button.disabled = false;
                button.textContent = "Cetak ke PDF (A4)";
            }
        }

        // Inisialisasi: pilih Senin berikutnya
        window.addEventListener("load", function() {
            const today = new Date();

            const nextMonday = new Date(
                today.getFullYear(),
                today.getMonth(),
                today.getDate()
            );

            const dayOfWeek = nextMonday.getDay();

            // Jika hari ini Senin, pilih Senin minggu depan
            const daysUntilMonday =
                (8 - dayOfWeek) % 7 || 7;

            nextMonday.setDate(
                nextMonday.getDate() + daysUntilMonday
            );

            document.getElementById("startDate").value =
                formatInputDate(nextMonday);

            generateSchedule();
        });
    </script>

</body>
</html>
